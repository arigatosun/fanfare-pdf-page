<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>担当カウンセラーを決める</title>
  <style>
    body { margin: 0; background: #f4f7fb; color: #1f2933; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
    main { max-width: 480px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .q { font-size: 15px; line-height: 1.8; margin: 0; }
    .name { display: block; font-size: 24px; font-weight: bold; margin: 8px 0; }
    .current { font-size: 13px; color: #52606d; margin: 12px 0 0; }
    button { width: 100%; margin-top: 24px; padding: 12px; font-size: 16px; font-weight: bold; color: #fff; background: #1a73e8; border: 0; border-radius: 8px; }
    button:disabled { background: #9aa5b1; }
    .msg { margin-top: 16px; font-size: 14px; line-height: 1.6; }
    .error { color: #c62828; }
    .ok { color: #1b7f3b; }
    [hidden] { display: none; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>担当カウンセラーを決める</h1>
    <div id="confirm" hidden>
      <p class="q"><span id="title"></span> 様の担当を<span id="name" class="name"></span>にしますか？</p>
      <p id="current" class="current" hidden></p>
      <button id="go" type="button">決定する</button>
    </div>
    <p id="msg" class="msg">読み込んでいます…</p>
  </div>
</main>
<script>
  // GAS の Web アプリ（poc/gas/PdfLink.js）。Cookie を送らないので、複数アカウントでログインしていても URL が書き換わらない。
  var API = 'https://script.google.com/macros/s/AKfycby47z1xlCO3APcY2k7xT_st7J8Ftg4_H-2fJLwDQYRTpZU506zwTpedlbohEbUVG8sm4g/exec';
  var params = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  function show(text, cls) { msg.textContent = text; msg.className = 'msg ' + (cls || ''); }

  // リンクを開いただけでは決めない。メールのセキュリティ機能がリンクを先に開くことがあるため、決定ボタンで初めて決める。
  function call(action) {
    var body = { action: action, case: params.get('case') || '', c: params.get('c') || '', sig: params.get('sig') || '' };
    // 通信が一時的に失敗することがある（2026-10-14 に「Failed to fetch」を確認）ので、2回までやり直す
    var attempt = function (left) {
      return fetch(API, { method: 'POST', body: JSON.stringify(body), credentials: 'omit' }).catch(function (err) {
        if (left <= 0) throw new Error('通信に失敗しました。時間をおいてもう一度お試しください。');
        return new Promise(function (r) { setTimeout(r, 2000); }).then(function () { return attempt(left - 1); });
      });
    };
    return attempt(2)
      .then(function (res) { return res.json(); })
      .then(function (data) { if (data.error) throw new Error(data.error); return data; });
  }

  call('assign-info')
    .then(function (info) {
      document.getElementById('title').textContent = info.title;
      document.getElementById('name').textContent = info.counselor + ' さん';
      if (info.current) {
        var current = document.getElementById('current');
        current.textContent = info.current === info.counselor ? 'すでに ' + info.current + ' さんが担当です。' : 'いまの担当は ' + info.current + ' さんです。決定すると入れ替わります。';
        current.hidden = false;
      }
      document.getElementById('confirm').hidden = false;
      show('');
    })
    .catch(function (err) { show(err.message, 'error'); });

  go.addEventListener('click', function () {
    go.disabled = true;
    show('設定しています（10秒ほどかかります）…');
    call('assign')
      .then(function (res) {
        show(res.counselor + ' さんに決まりました。スライド3を差し替え、' + res.counselor + ' さんにお知らせを送りました。', 'ok');
      })
      .catch(function (err) { show(err.message, 'error'); go.disabled = false; });
  });
</script>
</body>
</html>
